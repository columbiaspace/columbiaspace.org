# Imports blog posts from the Google Form. See docs/blog-submissions.md.
name: Import blog submissions

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: blog-import

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      BLOG_SHEET_ID: ${{ secrets.BLOG_SHEET_ID }}
    steps:
      - name: Check configuration
        id: check
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$BLOG_SHEET_ID" ] && [ -n "$PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Blog import secrets aren't set, skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: master

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.check.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.check.outputs.ready == 'true'

      - name: Import submissions
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run scripts/blog_import.py
        env:
          GH_TOKEN: ${{ github.token }}
